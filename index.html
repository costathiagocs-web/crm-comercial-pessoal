<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>CRM Comercial Pessoal 2.1</title><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script><style>
:root{font-family:system-ui,Arial,sans-serif;color:#152d4d;background:#f4f7fb}*{box-sizing:border-box}body{margin:0}header{background:#10376d;color:white;padding:17px max(18px,calc((100vw - 1120px)/2));display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap}h1{font-size:21px;margin:0}h2{font-size:19px}small,.muted{color:#66778d}header small{color:#b9d2f4}main{max-width:1120px;margin:24px auto;padding:0 15px}.card{background:white;border:1px solid #dde6f1;border-radius:13px;padding:19px;margin-bottom:15px;box-shadow:0 2px 12px #132e5210}.grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px}.kpi b{display:block;font-size:24px;color:#10376d;margin-top:8px}.tabs{display:flex;gap:8px;overflow:auto;margin-bottom:15px}.tabs button{white-space:nowrap}button{border:0;border-radius:9px;padding:11px 15px;background:#1767c8;color:white;cursor:pointer;font-weight:650}button.secondary{background:#eaf1fa;color:#174579}button.danger{background:#a82940}input,select,textarea{width:100%;border:1px solid #cbd6e5;border-radius:8px;padding:10px;font:inherit;background:white}label{display:block;font-size:13px;font-weight:650;margin:10px 0 5px}.formgrid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:0 13px}.formactions{display:flex;gap:9px;margin-top:15px;flex-wrap:wrap}.tablewrap{overflow:auto}table{width:100%;border-collapse:collapse;min-width:650px}td,th{text-align:left;padding:11px 9px;border-bottom:1px solid #e7edf5;font-size:14px}th{color:#536982}.pill{background:#e8f0fb;color:#205392;border-radius:50px;padding:5px 9px;font-size:12px}.notice{background:#fff7e8;border:1px solid #f1d8a6;padding:12px;border-radius:9px;margin:12px 0}.good{color:#177346}.bad{color:#a82940}.hidden{display:none!important}.row{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}.auth{max-width:440px;margin:55px auto}.stack{display:grid;gap:9px}.item{padding:11px 0;border-bottom:1px solid #e8eef7}.item:last-child{border:0}pre{white-space:pre-wrap;font-family:inherit}#msg{margin:10px 0}a{color:#1464c6}@media(max-width:700px){.grid{grid-template-columns:repeat(2,minmax(0,1fr))}.formgrid{grid-template-columns:1fr}header{padding:15px}main{margin:15px auto}.kpi b{font-size:20px}} </style></head><body><header><div><h1>CRM Comercial Pessoal</h1><small>Versão 2.1 • Supabase • Olist Tiny (lançamento manual)</small></div><div id="who"></div></header><main><div id="msg" role="status"></div><section id="login" class="card auth"><h2>Entrar no CRM</h2><p class="muted">Entre com o usuário criado em Authentication → Users no Supabase.</p><form id="loginForm"><label>E-mail</label><input id="email" type="email" required autocomplete="username"><label>Senha</label><input id="password" type="password" required autocomplete="current-password"><div class="formactions"><button>Entrar</button></div></form><p class="muted">Seu acesso é individual. Não compartilhe sua senha.</p></section><section id="app" class="hidden"><nav class="tabs" id="tabs"><button data-tab="dashboard">Dashboard</button><button data-tab="clientes">Clientes</button><button data-tab="orcamentos">Orçamentos</button><button data-tab="vendas">Vendas</button><button data-tab="acompanhamentos">Acompanhamentos</button><button data-tab="relatorio">Relatório semanal</button></nav><div id="dashboard" class="view"></div><div id="clientes" class="view hidden"></div><div id="orcamentos" class="view hidden"></div><div id="vendas" class="view hidden"></div><div id="acompanhamentos" class="view hidden"></div><div id="relatorio" class="view hidden"></div></section></main><script>
const URL_SUPA='https://eavevtiurfxcjmeoikav.supabase.co', KEY_SUPA='sb_publishable_33Gejvoqk0Of55KAeo8hOA_LDTYw0I-';
const $=id=>document.getElementById(id), esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])), money=n=>Number(n||0).toLocaleString('pt-BR',{style:'currency',currency:'BRL'}), day=d=>d?new Date(String(d).slice(0,10)+'T12:00:00').toLocaleDateString('pt-BR'):'—', today=()=>new Date().toLocaleDateString('en-CA'), days=d=>d?Math.floor((new Date(today()+'T12:00:00')-new Date(d+'T12:00:00'))/86400000):0;
let sb, user=null, data={clientes:[],orcamentos:[],vendas:[],acompanhamentos:[]}, tab='dashboard';
function message(t,error=false){$('msg').innerHTML='<div class="'+(error?'notice':'card')+'">'+esc(t)+'</div>';setTimeout(()=>$('msg').innerHTML='',7000)}
if(!window.supabase){message('Biblioteca de conexão não carregou. Verifique sua internet e recarregue.',true)}else{sb=window.supabase.createClient(URL_SUPA,KEY_SUPA,{auth:{persistSession:true,autoRefreshToken:true}});sb.auth.onAuthStateChange((_event,session)=>{const id=session?.user?.id;if(id!==user?.id){user=session?.user||null;setTimeout(boot,0)}});sb.auth.getSession().then(({data:r})=>{user=r.session?.user||null;boot()})}
$('loginForm').onsubmit=async e=>{e.preventDefault();const {error}=await sb.auth.signInWithPassword({email:$('email').value.trim(),password:$('password').value});if(error)message('Não foi possível entrar: '+error.message,true);else{message('Login realizado');await boot()}};
async function boot(){$('login').classList.toggle('hidden',!!user);$('app').classList.toggle('hidden',!user);$('who').innerHTML=user?'<span>'+esc(user.email)+'</span> <button class="secondary" id="logout">Sair</button>':'';if(user){$('logout').onclick=()=>sb.auth.signOut();await refresh()}}
async function refresh(){try{for(const table of Object.keys(data)){let {data:rows,error}=await sb.from(table).select('*').order('criado_em',{ascending:false}).limit(1000);if(error)throw Error(table+': '+error.message);data[table]=rows||[]}render()}catch(e){message('Erro ao carregar registros: '+e.message,true)}}
function show(t){tab=t;document.querySelectorAll('.view').forEach(v=>v.classList.toggle('hidden',v.id!==t));document.querySelectorAll('[data-tab]').forEach(b=>b.classList.toggle('secondary',b.dataset.tab!==t))}document.querySelectorAll('[data-tab]').forEach(b=>b.onclick=()=>show(b.dataset.tab));
function clientName(id){return data.clientes.find(c=>c.id===id)?.empresa||'Cliente não encontrado'}function opts(arr,label){return arr.map(x=>'<option value="'+esc(x.id)+'">'+esc(label(x))+'</option>').join('')}
function render(){renderDashboard();renderClients();renderQuotes();renderSales();renderFollowups();renderReport();show(tab)}
function kpi(title,value){return '<div class="card kpi"><small>'+title+'</small><b>'+value+'</b></div>'}
function analysis(){let pending=data.orcamentos.filter(o=>['pendente','negociacao'].includes(o.status));let overdue=pending.filter(o=>o.proximo_contato&&o.proximo_contato<today());let old=pending.filter(o=>days(o.data_orcamento)>=5&&!data.acompanhamentos.some(a=>a.orcamento_id===o.id));let win=data.orcamentos.filter(o=>o.status==='aprovado').length;let lost=data.orcamentos.filter(o=>o.status==='perdido');let notes=[];if(overdue.length)notes.push('Prioridade alta: '+overdue.length+' orçamento(s) com retorno vencido.');if(old.length)notes.push(old.length+' proposta(s) com pelo menos cinco dias e sem acompanhamento registrado.');if(lost.length)notes.push('Analise os motivos de perda em '+lost.length+' orçamento(s) para verificar padrões de preço, prazo e concorrência.');if(!notes.length)notes.push('Cadastre propostas e acompanhamentos para receber alertas específicos.');return {pending,overdue,old,win,notes}}
function renderDashboard(){let q=data.orcamentos,v=data.vendas,a=analysis(),sum=v.reduce((s,x)=>s+Number(x.valor),0),rate=q.length?100*a.win/q.length:0;let ranked=[...a.pending].sort((x,y)=>Number(!!y.proximo_contato&&y.proximo_contato<today())-Number(!!x.proximo_contato&&x.proximo_contato<today())||Number(y.valor)-Number(x.valor));$('dashboard').innerHTML='<div class="grid">'+kpi('Orçamentos',q.length)+kpi('Valor orçado',money(q.reduce((s,x)=>s+Number(x.valor),0)))+kpi('Pedidos de venda',v.length)+kpi('Valor vendido',money(sum))+kpi('Aproveitamento',rate.toFixed(1).replace('.',',')+'%')+kpi('Ticket médio',money(v.length?sum/v.length:0))+kpi('Em aberto',a.pending.length)+kpi('Retornos atrasados',a.overdue.length)+'</div><div class="card"><h2>Assistente comercial • análise automática</h2><p class="muted">Sugestões baseadas em regras, sem IA generativa conectada nesta versão.</p>'+a.notes.map(n=>'<div class="item">• '+esc(n)+'</div>').join('')+'</div><div class="card"><h2>Oportunidades prioritárias</h2>'+(!ranked.length?'<p>Nenhum orçamento pendente.</p>':ranked.slice(0,8).map(o=>'<div class="item"><b>'+esc(clientName(o.cliente_id))+'</b> — '+money(o.valor)+' • '+esc(o.status)+' • Próximo contato: '+day(o.proximo_contato)+'</div>').join(''))+'</div>'}
async function save(table,payload){let {error}=await sb.from(table).insert({...payload,usuario_id:user.id});if(error)message('Erro ao salvar: '+error.message,true);else{message('Registro salvo');await refresh()}}
function formHandler(id,fn){$(id).onsubmit=async e=>{e.preventDefault();const fd=new FormData(e.target),p=Object.fromEntries(fd.entries());Object.keys(p).forEach(k=>{if(p[k]==='')p[k]=null});await fn(p)}}
function renderClients(){$('clientes').innerHTML='<div class="card"><h2>Novo cliente</h2><form id="fc"><div class="formgrid">'+[['empresa','Empresa *'],['cnpj','CNPJ'],['contato','Pessoa de contato'],['telefone','WhatsApp / telefone'],['email','E-mail'],['cidade','Cidade'],['estado','Estado'],['origem','Origem do cliente']].map(([n,l])=>'<div><label>'+l+'</label><input name="'+n+'" '+(n==='empresa'?'required':'')+'></div>').join('')+'</div><label>Observações</label><textarea name="observacoes"></textarea><div class="formactions"><button>Salvar cliente</button></div></form></div><div class="card"><h2>Clientes cadastrados ('+data.clientes.length+')</h2><div class="tablewrap"><table><thead><tr><th>Empresa</th><th>Contato</th><th>Telefone</th><th>CNPJ</th></tr></thead><tbody>'+data.clientes.map(c=>'<tr><td>'+esc(c.empresa)+'</td><td>'+esc(c.contato)+'</td><td>'+esc(c.telefone)+'</td><td>'+esc(c.cnpj)+'</td></tr>').join('')+'</tbody></table></div></div>';formHandler('fc',p=>save('clientes',p))}
let editingQuoteId=null;
function quoteFormFields(o){const val=(k)=>esc(o?.[k]??'');const selected=(k,v)=>o?.[k]===v?' selected':'';return '<div class="formgrid"><div><label>Cliente *</label><select name="cliente_id" required>'+data.clientes.map(c=>'<option value="'+esc(c.id)+'"'+selected('cliente_id',c.id)+'>'+esc(c.empresa)+'</option>').join('')+'</select></div><div><label>Número no Tiny</label><input name="numero_tiny" value="'+val('numero_tiny')+'"></div><div><label>Data *</label><input name="data_orcamento" type="date" value="'+(o?val('data_orcamento'):today())+'" required></div><div><label>Valor em R$ *</label><input name="valor" type="number" min="0" step="0.01" value="'+val('valor')+'" required></div><div><label>Produto / categoria</label><input name="produto" value="'+val('produto')+'"></div><div><label>Quantidade</label><input name="quantidade" type="number" min="0" step="0.01" value="'+val('quantidade')+'"></div><div><label>Situação</label><select name="status">'+[['pendente','Pendente'],['negociacao','Em negociação'],['aprovado','Aprovado'],['perdido','Perdido']].map(([v,l])=>'<option value="'+v+'"'+selected('status',v)+'>'+l+'</option>').join('')+'</select></div><div><label>Próximo contato</label><input name="proximo_contato" type="date" value="'+val('proximo_contato')+'"></div><div><label>Motivo de perda</label><input name="motivo_perda" value="'+val('motivo_perda')+'"></div></div><label>Observações</label><textarea name="observacoes">'+esc(o?.observacoes??'')+'</textarea>'}
function renderQuotes(){const current=data.orcamentos.find(o=>o.id===editingQuoteId);if(editingQuoteId&&!current)editingQuoteId=null;
$('orcamentos').innerHTML='<div class="card" id="quoteEditor"><h2>'+(current?'Editar orçamento':'Novo orçamento')+'</h2>'+(!data.clientes.length?'<div class="notice">Cadastre um cliente primeiro.</div>':'')+'<form id="fq">'+quoteFormFields(current)+'<div class="formactions"><button '+(!data.clientes.length?'disabled':'')+'>'+(current?'Salvar alterações':'Salvar orçamento')+'</button>'+(current?'<button type="button" class="secondary" id="cancelQuote">Cancelar edição</button>':'')+'</div></form></div><div class="card"><h2>Orçamentos ('+data.orcamentos.length+')</h2><div class="tablewrap"><table><thead><tr><th>Tiny</th><th>Cliente</th><th>Valor</th><th>Status</th><th>Retorno</th><th>Ações</th></tr></thead><tbody>'+data.orcamentos.map(o=>'<tr><td>'+esc(o.numero_tiny)+'</td><td>'+esc(clientName(o.cliente_id))+'</td><td>'+money(o.valor)+'</td><td><span class="pill">'+esc(o.status)+'</span></td><td>'+day(o.proximo_contato)+'</td><td><div class="formactions"><button type="button" class="secondary" data-edit-quote="'+esc(o.id)+'">Editar</button><button type="button" class="secondary" data-delete-quote="'+esc(o.id)+'">Excluir</button></div></td></tr>').join('')+'</tbody></table></div></div>';
formHandler('fq',async p=>{if(!Number.isFinite(Number(p.valor))||Number(p.valor)<0){message('Informe um valor válido.',true);return}const id=editingQuoteId;let result=id?await sb.from('orcamentos').update(p).eq('id',id).eq('usuario_id',user.id):await sb.from('orcamentos').insert({...p,usuario_id:user.id});if(result.error){message('Erro ao salvar orçamento: '+result.error.message,true);return}editingQuoteId=null;message(id?'Orçamento atualizado':'Orçamento cadastrado');await refresh()});
if(current)$('cancelQuote').onclick=()=>{editingQuoteId=null;renderQuotes()};
document.querySelectorAll('[data-edit-quote]').forEach(el=>el.onclick=()=>{editingQuoteId=el.dataset.editQuote;renderQuotes();document.getElementById('quoteEditor').scrollIntoView({behavior:'smooth',block:'start'})});
document.querySelectorAll('[data-delete-quote]').forEach(el=>el.onclick=async()=>{const id=el.dataset.deleteQuote,o=data.orcamentos.find(x=>x.id===id);if(!o)return;const nv=data.vendas.filter(x=>x.orcamento_id===id).length,na=data.acompanhamentos.filter(x=>x.orcamento_id===id).length;if(nv||na){message('Não é possível excluir: orçamento vinculado a '+nv+' venda(s) e '+na+' acompanhamento(s). Preserve o histórico ou resolva os vínculos primeiro.',true);return}if(!confirm('Excluir definitivamente o orçamento '+(o.numero_tiny||'sem número')+' de '+clientName(o.cliente_id)+' no valor de '+money(o.valor)+'? Esta ação não pode ser desfeita.'))return;el.disabled=true;const {error}=await sb.from('orcamentos').delete().eq('id',id).eq('usuario_id',user.id);if(error){message('Não foi possível excluir: '+error.message,true);el.disabled=false;return}if(editingQuoteId===id)editingQuoteId=null;message('Orçamento excluído');await refresh()})}
function renderSales(){$('vendas').innerHTML='<div class="card"><h2>Novo pedido de venda</h2><p class="muted">Cadastre pedidos efetivamente realizados. Evite duplicar um pedido.</p><form id="fv"><div class="formgrid"><div><label>Orçamento relacionado (opcional)</label><select name="orcamento_id"><option value="">Sem orçamento relacionado</option>'+opts(data.orcamentos,o=>(o.numero_tiny||'Sem número')+' — '+clientName(o.cliente_id))+'</select></div><div><label>Número do pedido Tiny</label><input name="numero_pedido_tiny"></div><div><label>Data da venda</label><input name="data_venda" type="date" value="'+today()+'" required></div><div><label>Valor em R$</label><input name="valor" type="number" min="0" step="0.01" required></div></div><label>Observações</label><textarea name="observacoes"></textarea><div class="formactions"><button>Salvar venda</button></div></form></div><div class="card"><h2>Pedidos realizados</h2><div class="tablewrap"><table><thead><tr><th>Pedido Tiny</th><th>Data</th><th>Valor</th><th>Orçamento</th></tr></thead><tbody>'+data.vendas.map(v=>'<tr><td>'+esc(v.numero_pedido_tiny)+'</td><td>'+day(v.data_venda)+'</td><td>'+money(v.valor)+'</td><td>'+esc(data.orcamentos.find(o=>o.id===v.orcamento_id)?.numero_tiny||'—')+'</td></tr>').join('')+'</tbody></table></div></div>';formHandler('fv',p=>save('vendas',p))}
function renderFollowups(){$('acompanhamentos').innerHTML='<div class="card"><h2>Registrar acompanhamento</h2><form id="fa"><div class="formgrid"><div><label>Orçamento</label><select name="orcamento_id" required>'+opts(data.orcamentos,o=>(o.numero_tiny||'Sem número')+' — '+clientName(o.cliente_id))+'</select></div><div><label>Canal</label><select name="canal"><option value="whatsapp">WhatsApp</option><option value="email">E-mail</option><option value="telefone">Telefone</option><option value="outro">Outro</option></select></div><div><label>Próximo contato</label><input type="date" name="proximo_contato"></div><div><label>Próxima ação</label><input name="proxima_acao"></div></div><label>Resultado do contato</label><textarea name="resultado"></textarea><div class="formactions"><button '+(!data.orcamentos.length?'disabled':'')+'>Registrar acompanhamento</button></div></form></div><div class="card"><h2>Histórico de contatos</h2>'+data.acompanhamentos.map(a=>'<div class="item"><b>'+esc(data.orcamentos.find(o=>o.id===a.orcamento_id)?.numero_tiny||'Orçamento')+'</b> • '+esc(a.canal)+' • '+day(a.data_contato)+'<p>'+esc(a.resultado)+'</p><small>Próxima ação: '+esc(a.proxima_acao)+' | '+day(a.proximo_contato)+'</small></div>').join('')+'</div>';formHandler('fa',p=>save('acompanhamentos',p))}
function reportText(){let end=new Date(today()+'T12:00:00'),start=new Date(end);start.setDate(end.getDate()-6);let d0=start.toLocaleDateString('en-CA'),d1=today(),q=data.orcamentos.filter(o=>o.data_orcamento>=d0&&o.data_orcamento<=d1),v=data.vendas.filter(o=>o.data_venda>=d0&&o.data_venda<=d1),a=analysis(),win=q.filter(o=>o.status==='aprovado').length;return 'RELATÓRIO SEMANAL — '+day(d0)+' a '+day(d1)+'\nOrçamentos: '+q.length+' | Valor: '+money(q.reduce((s,o)=>s+Number(o.valor),0))+'\nPedidos: '+v.length+' | Valor: '+money(v.reduce((s,o)=>s+Number(o.valor),0))+'\nAproveitamento das propostas da semana (status aprovado): '+(q.length?(win/q.length*100).toFixed(1):'0')+'%\nRetornos vencidos (total atual): '+a.overdue.length+'\n\nAÇÕES RECOMENDADAS\n'+a.notes.map((n,i)=>(i+1)+'. '+n).join('\n')+'\n\nObservação: taxa baseada no status atual dos orçamentos criados na semana; pedidos são medidos por data de venda.'}
function renderReport(){$('relatorio').innerHTML='<div class="card"><h2>Relatório semanal</h2><p class="muted">Últimos sete dias, incluindo hoje. Geração manual e recomendações por regras.</p><pre id="reportBody">'+esc(reportText())+'</pre><div class="formactions"><button id="copyReport">Copiar relatório</button><button class="secondary" id="downloadReport">Baixar .txt</button></div></div><div class="card"><h2>Modelo de mensagem para acompanhamento</h2><p>Olá, tudo bem? Gostaria de saber se você conseguiu avaliar nossa proposta comercial. Estou à disposição para esclarecer dúvidas sobre valores, prazos ou especificações. Podemos conversar?</p><button class="secondary" id="copyMessage">Copiar mensagem</button></div>'; $('copyReport').onclick=()=>navigator.clipboard.writeText(reportText()).then(()=>message('Relatório copiado'));$('downloadReport').onclick=()=>{let blob=new Blob([reportText()],{type:'text/plain;charset=utf-8'}),a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='relatorio-semanal-crm.txt';a.click();setTimeout(()=>URL.revokeObjectURL(a.href),2000)};$('copyMessage').onclick=()=>navigator.clipboard.writeText('Olá, tudo bem? Gostaria de saber se você conseguiu avaliar nossa proposta comercial. Estou à disposição para esclarecer dúvidas sobre valores, prazos ou especificações. Podemos conversar?').then(()=>message('Mensagem copiada'))}
</script></body></html>
