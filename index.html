ld{border:0}pre{white-space:pre-wrap;font-family:inherit}#msg{margin:10px 0}a{color:#1464c6}@media(max-width:700px){.grid{grid-template-columns:repeat(2,minmax(0,1fr))}.formgrid{grid-template-columns:1fr}header{padding:15px}main{margin:15px auto}.kpi b{font-size:20px}}  .chatlog{max-height:420px;overflow:auto;display:grid;gap:12px;margin:14px 0}.bubble{padding:12px 15px;border-radius:12px;white-space:pre-wrap;line-height:1.55;background:#edf3fb}.bubble.me{background:#dbeaff;margin-left:12%}.chipbar{display:flex;gap:8px;flex-wrap:wrap}.chipbar button{font-size:12px;padding:9px}.priority{border-left:4px solid #1767c8;padding-left:12px;margin:10px 0}.priority.high{border-color:#bd5c21}.assistantnote{font-size:13px;color:#5c708a} </style></head><body><header><div><h1>CRM Comercial Pessoal</h1><small>Versão 3.2 • Supabase • Olist Tiny (lançamento manual)</small></div><div id="who"></div></header><main><div id="msg" role="status"></div><section id="login" class="card auth"><h2>Entrar no CRM</h2><p class="muted">Entre com o usuário criado em Authentication → Users no Supabase.</p><form id="loginForm"><label>E-mail</label><input id="email" type="email" required autocomplete="username"><label>Senha</label><input id="password" type="password" required autocomplete="current-password"><div class="formactions"><button>Entrar</button></div></form><p class="muted">Seu acesso é individual. Não compartilhe sua senha.</p></section><section id="app" class="hidden"><nav class="tabs" id="tabs"><button data-tab="dashboard">Dashboard</button><button data-tab="clientes">Clientes</button><button data-tab="orcamentos">Orçamentos</button><button data-tab="vendas">Vendas</button><button data-tab="acompanhamentos">Acompanhamentos</button><button data-tab="relatorio">Relatório semanal</button><button data-tab="assistente">Assistente inteligente</button></nav><div id="dashboard" class="view"></div><div id="clientes" class="view hidden"></div><div id="orcamentos" class="view hidden"></div><div id="vendas" class="view hidden"></div><div id="acompanhamentos" class="view hidden"></div><div id="relatorio" class="view hidden"></div><div id="assistente" class="view hidden"></div></section></main><script>
const URL_SUPA='https://eavevtiurfxcjmeoikav.supabase.co', KEY_SUPA='sb_publishable_33Gejvoqk0Of55KAeo8hOA_LDTYw0I-';
const $=id=>document.getElementById(id), esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])), money=n=>Number(n||0).toLocaleString('pt-BR',{style:'currency',currency:'BRL'}), day=d=>d?new Date(String(d).slice(0,10)+'T12:00:00').toLocaleDateString('pt-BR'):'—', today=()=>new Date().toLocaleDateString('en-CA'), days=d=>d?Math.floor((new Date(today()+'T12:00:00')-new Date(d+'T12:00:00'))/86400000):0;
let sb, user=null, data={clientes:[],orcamentos:[],vendas:[],acompanhamentos:[]}, tab='dashboard';

function analysis(){let pending=data.orcamentos.filter(o=>['pendente','negociacao'].includes(o.status));let overdue=pending.filter(o=>o.proximo_contato&&o.proximo_contato<today());let old=pending.filter(o=>days(o.data_orcamento)>=5&&!data.acompanhamentos.some(a=>a.orcamento_id===o.id));let win=data.orcamentos.filter(o=>o.status==='aprovado').length;let lost=data.orcamentos.filter(o=>o.status==='perdido');let notes=[];if(overdue.length)notes.push('Prioridade alta: '+overdue.length+' orçamento(s) com retorno vencido.');if(old.length)notes.push(old.length+' proposta(s) com pelo menos cinco dias e sem acompanhamento registrado.');if(lost.length)notes.push('Analise os motivos de perda em '+lost.length+' orçamento(s) para verificar padrões de preço, prazo e concorrência.');if(!notes.length)notes.push('Cadastre propostas e acompanhamentos para receber alertas específicos.');return {pending,overdue,old,win,notes}}
function renderDashboard(){let q=data.orcamentos,v=data.vendas,a=analysis(),sum=v.reduce((s,x)=>s+Number(x.valor),0),rate=q.length?100*a.win/q.length:0;let ranked=[...a.pending].sort((x,y)=>Number(!!y.proximo_contato&&y.proximo_contato<today())-Number(!!x.proximo_contato&&x.proximo_contato<today())||Number(y.valor)-Number(x.valor));$('dashboard').innerHTML='<div class="grid">'+kpi('Orçamentos',q.length)+kpi('Valor orçado',money(q.reduce((s,x)=>s+Number(x.valor),0)))+kpi('Pedidos de venda',v.length)+kpi('Valor vendido',money(sum))+kpi('Aproveitamento',rate.toFixed(1).replace('.',',')+'%')+kpi('Ticket médio',money(v.length?sum/v.length:0))+kpi('Em aberto',a.pending.length)+kpi('Retornos atrasados',a.overdue.length)+'</div><div class="card"><h2>Assistente comercial • análise automática</h2><p class="muted">Sugestões baseadas em regras, sem IA generativa conectada nesta versão.</p>'+a.notes.map(n=>'<div class="item">• '+esc(n)+'</div>').join('')+'</div><div class="card"><h2>Oportunidades prioritárias</h2>'+(!ranked.length?'<p>Nenhum orçamento pendente.</p>':ranked.slice(0,8).map(o=>'<div class="item"><b>'+esc(clientName(o.cliente_id))+'</b> — '+money(o.valor)+' • '+esc(o.status)+' • Próximo contato: '+day(o.proximo_contato)+'</div>').join(''))+'</div>'}
async function save(table,payload){let {error}=await sb.from(table).insert({...payload,usuario_id:user.id});if(error)message('Erro ao salvar: '+error.message,true);else{message('Registro salvo');await refresh()}}
function formHandler(id,fn){$(id).onsubmit=async e=>{e.preventDefault();const fd=new FormData(e.target),p=Object.fromEntries(fd.entries());Object.keys(p).forEach(k=>{if(p[k]==='')p[k]=null});await fn(p)}}
function renderClients(){$('clientes').innerHTML='<div class="card"><h2>Novo cliente</h2><form id="fc"><div class="formgrid">'+[['empresa','Empresa *'],['cnpj','CNPJ'],['contato','Pessoa de contato'],['telefone','WhatsApp / telefone'],['email','E-mail'],['cidade','Cidade'],['estado','Estado'],['origem','Origem do cliente']].map(([n,l])=>'<div><label>'+l+'</label><input name="'+n+'" '+(n==='empresa'?'required':'')+'></div>').join('')+'</div><label>Observações</label><textarea name="observacoes"></textarea><div class="formactions"><button>Salvar cliente</button></div></form></div><div class="card"><h2>Clientes cadastrados ('+data.clientes.length+')</h2><div class="tablewrap"><table><thead><tr><th>Empresa</th><th>Contato</th><th>Telefone</th><th>CNPJ</th></tr></thead><tbody>'+data.clientes.map(c=>'<tr><td>'+esc(c.empresa)+'</td><td>'+esc(c.contato)+'</td><td>'+esc(c.telefone)+'</td><td>'+esc(c.cnpj)+'</td></tr>').join('')+'</tbody></table></div></div>';formHandler('fc',p=>save('clientes',p))}
let editingQuoteId=null;
function quoteFormFields(o){const val=(k)=>esc(o?.[k]??'');const selected=(k,v)=>o?.[k]===v?' selected':'';return '<div class="formgrid"><div><label>Cliente *</label><select name="cliente_id" required>'+data.clientes.map(c=>'<option value="'+esc(c.id)+'"'+selected('cliente_id',c.id)+'>'+esc(c.empresa)+'</option>').join('')+'</select></div><div><label>Número no Tiny</label><input name="numero_tiny" value="'+val('numero_tiny')+'"></div><div><label>Data *</label><input name="data_orcamento" type="date" value="'+(o?val('data_orcamento'):today())+'" required></div><div><label>Valor em R$ *</label><input name="valor" type="number" min="0" step="0.01" value="'+val('valor')+'" required></div><div><label>Produto / categoria</label><input name="produto" value="'+val('produto')+'"></div><div><label>Quantidade</label><input name="quantidade" type="number" min="0" step="0.01" value="'+val('quantidade')+'"></div><div><label>Situação</label><select name="status">'+[['pendente','Pendente'],['negociacao','Em negociação'],['aprovado','Aprovado'],['perdido','Perdido']].map(([v,l])=>'<option value="'+v+'"'+selected('status',v)+'>'+l+'</option>').join('')+'</select></div><div><label>Próximo contato</label><input name="proximo_contato" type="date" value="'+val('proximo_contato')+'"></div><div><label>Motivo de perda</label><input name="motivo_perda" value="'+val('motivo_perda')+'"></div><div><label>Último contato</label><input name="ultimo_contato" type="date" value="'+val('ultimo_contato')+'"></div><div><label>Prioridade manual</label><select name="prioridade">'+[['normal','Normal'],['alta','Alta'],['baixa','Baixa']].map(([v,l])=>'<option value="'+v+'"'+(o?.prioridade===v?' selected':'')+'>'+l+'</option>').join('')+'</select></div><div><label>Categoria do motivo de perda</label><select name="motivo_perda_categoria">'+[['','Não informado'],['preco','Preço'],['prazo','Prazo'],['concorrencia','Concorrência'],['desistencia','Desistência'],['outro','Outro']].map(([v,l])=>'<option value="'+v+'"'+(o?.motivo_perda_categoria===v?' selected':'')+'>'+l+'</option>').join('')+'</select></div><div><label>Concorrente</label><input name="concorrente" value="'+val('concorrente')+'"></div><div><label>Prazo de entrega (dias)</label><input name="prazo_entrega_dias" type="number" min="0" step="1" value="'+val('prazo_entrega_dias')+'"></div><div><label>Custo estimado em R$</label><input name="custo_estimado" type="number" min="0" step="0.01" value="'+val('custo_estimado')+'"></div></div><label>Observações</label><textarea name="observacoes">'+esc(o?.observacoes??'')+'</textarea>'}
function renderQuotes(){const current=data.orcamentos.find(o=>o.id===editingQuoteId);if(editingQuoteId&&!current)editingQuoteId=null;
$('orcamentos').innerHTML='<div class="card" id="quoteEditor"><h2>'+(current?'Editar orçamento':'Novo orçamento')+'</h2>'+(!data.clientes.length?'<div class="notice">Cadastre um cliente primeiro.</div>':'')+'<form id="fq">'+quoteFormFields(current)+'<div class="formactions"><button '+(!data.clientes.length?'disabled':'')+'>'+(current?'Salvar alterações':'Salvar orçamento')+'</button>'+(current?'<button type="button" class="secondary" id="cancelQuote">Cancelar edição</button>':'')+'</div></form></div><div class="card"><h2>Orçamentos ('+data.orcamentos.length+')</h2><div class="tablewrap"><table><thead><tr><th>Tiny</th><th>Cliente</th><th>Valor</th><th>Status</th><th>Retorno</th><th>Ações</th></tr></thead><tbody>'+data.orcamentos.map(o=>'<tr><td>'+esc(o.numero_tiny)+'</td><td>'+esc(clientName(o.cliente_id))+'</td><td>'+money(o.valor)+'</td><td><span class="pill">'+esc(o.status)+'</span></td><td>'+day(o.proximo_contato)+'</td><td><div class="formactions"><button type="button" class="secondary" data-edit-quote="'+esc(o.id)+'">Editar</button><button type="button" class="secondary" data-delete-quote="'+esc(o.id)+'">Excluir</button></div></td></tr>').join('')+'</tbody></table></div></div>';
formHandler('fq',async p=>{if(!Number.isFinite(Number(p.valor))||Number(p.valor)<0){message('Informe um valor válido.',true);return}const id=editingQuoteId;let result=id?await sb.from('orcamentos').update(p).eq('id',id).eq('usuario_id',user.id):await sb.from('orcamentos').insert({...p,usuario_id:user.id});if(result.error){message('Erro ao salvar orçamento: '+result.error.message,true);return}editingQuoteId=null;message(id?'Orçamento atualizado':'Orçamento cadastrado');await refresh()});
if(current)$('cancelQuote').onclick=()=>{editingQuoteId=null;renderQuotes()};
document.querySelectorAll('[data-edit-quote]').forEach(el=>el.onclick=()=>{editingQuoteId=el.dataset.editQuote;renderQuotes();document.getElementById('quoteEditor').scrollIntoView({behavior:'smooth',block:'start'})});
document.querySelectorAll('[data-delete-quote]').forEach(el=>el.onclick=async()=>{const id=el.dataset.deleteQuote,o=data.orcamentos.find(x=>x.id===id);if(!o)return;const nv=data.vendas.filter(x=>x.orcamento_id===id).length,na=data.acompanhamentos.filter(x=>x.orcamento_id===id).length;if(nv||na){message('Não é possível excluir: orçamento vinculado a '+nv+' venda(s) e '+na+' acompanhamento(s). Preserve o histórico ou resolva os vínculos primeiro.',true);return}if(!confirm('Excluir definitivamente o orçamento '+(o.numero_tiny||'sem número')+' de '+clientName(o.cliente_id)+' no valor de '+money(o.valor)+'? Esta ação não pode ser desfeita.'))return;el.disabled=true;const {error}=await sb.from('orcamentos').delete().eq('id',id).eq('usuario_id',user.id);if(error){message('Não foi possível excluir: '+error.message,true);el.disabled=false;return}if(editingQuoteId===id)editingQuoteId=null;message('Orçamento excluído');await refresh()})}
function renderSales(){$('vendas').innerHTML='<div class="card"><h2>Novo pedido de venda</h2><p class="muted">Cadastre pedidos efetivamente realizados. Evite duplicar um pedido.</p><form id="fv"><div class="formgrid"><div><label>Orçamento relacionado (opcional)</label><select name="orcamento_id"><option value="">Sem orçamento relacionado</option>'+opts(data.orcamentos,o=>(o.numero_tiny||'Sem número')+' — '+clientName(o.cliente_id))+'</select></div><div><label>Número do pedido Tiny</label><input name="numero_pedido_tiny"></div><div><label>Data da venda</label><input name="data_venda" type="date" value="'+today()+'" required></div><div><label>Valor em R$</label><input name="valor" type="number" min="0" step="0.01" required></div></div><label>Observações</label><textarea name="observacoes"></textarea><div class="formactions"><button>Salvar venda</button></div></form></div><div class="card"><h2>Pedidos realizados</h2><div class="tablewrap"><table><thead><tr><th>Pedido Tiny</th><th>Data</th><th>Valor</th><th>Orçamento</th></tr></thead><tbody>'+data.vendas.map(v=>'<tr><td>'+esc(v.numero_pedido_tiny)+'</td><td>'+day(v.data_venda)+'</td><td>'+money(v.valor)+'</td><td>'+esc(data.orcamentos.find(o=>o.id===v.orcamento_id)?.numero_tiny||'—')+'</td></tr>').join('')+'</tbody></table></div></div>';formHandler('fv',p=>save('vendas',p))}
function renderFollowups(){$('acompanhamentos').innerHTML='<div class="card"><h2>Registrar acompanhamento</h2><form id="fa"><div class="formgrid"><div><label>Orçamento</label><select name="orcamento_id" required>'+opts(data.orcamentos,o=>(o.numero_tiny||'Sem número')+' — '+clientName(o.cliente_id))+'</select></div><div><label>Canal</label><select name="canal"><option value="whatsapp">WhatsApp</option><option value="email">E-mail</option><option value="telefone">Telefone</option><option value="outro">Outro</option></select></div><div><label>Próximo contato</label><input type="date" name="proximo_contato"></div><div><label>Próxima ação</label><input name="proxima_acao"></div></div><label>Resultado do contato</label><textarea name="resultado"></textarea><div class="formactions"><button '+(!data.orcamentos.length?'disabled':'')+'>Registrar acompanhamento</button></div></form></div><div class="card"><h2>Histórico de contatos</h2>'+data.acompanhamentos.map(a=>'<div class="item"><b>'+esc(data.orcamentos.find(o=>o.id===a.orcamento_id)?.numero_tiny||'Orçamento')+'</b> • '+esc(a.canal)+' • '+day(a.data_contato)+'<p>'+esc(a.resultado)+'</p><small>Próxima ação: '+esc(a.proxima_acao)+' | '+day(a.proximo_contato)+'</small></div>').join('')+'</div>';formHandler('fa',p=>save('acompanhamentos',p))}
function reportText(){let end=new Date(today()+'T12:00:00'),start=new Date(end);start.setDate(end.getDate()-6);let d0=start.toLocaleDateString('en-CA'),d1=today(),q=data.orcamentos.filter(o=>o.data_orcamento>=d0&&o.data_orcamento<=d1),v=data.vendas.filter(o=>o.data_venda>=d0&&o.data_venda<=d1),a=analysis(),win=q.filter(o=>o.status==='aprovado').length;return 'RELATÓRIO SEMANAL — '+day(d0)+' a '+day(d1)+'\nOrçamentos: '+q.length+' | Valor: '+money(q.reduce((s,o)=>s+Number(o.valor),0))+'\nPedidos: '+v.length+' | Valor: '+money(v.reduce((s,o)=>s+Number(o.valor),0))+'\nAproveitamento das propostas da semana (status aprovado): '+(q.length?(win/q.length*100).toFixed(1):'0')+'%\nRetornos vencidos (total atual): '+a.overdue.length+'\n\nAÇÕES RECOMENDADAS\n'+a.notes.map((n,i)=>(i+1)+'. '+n).join('\n')+'\n\nObservação: taxa baseada no status atual dos orçamentos criados na semana; pedidos são medidos por data de venda.'}
function renderReport(){$('relatorio').innerHTML='<div class="card"><h2>Relatório semanal</h2><p class="muted">Últimos sete dias, incluindo hoje. Geração manual e recomendações por regras.</p><pre id="reportBody">'+esc(reportText())+'</pre><div class="formactions"><button id="copyReport">Copiar relatório</button><button class="secondary" id="downloadReport">Baixar .txt</button></div></div><div class="card"><h2>Modelo de mensagem para acompanhamento</h2><p>Olá, tudo bem? Gostaria de saber se você conseguiu avaliar nossa proposta comercial. Estou à disposição para esclarecer dúvidas sobre valores, prazos ou especificações. Podemos conversar?</p><button class="secondary" id="copyMessage">Copiar mensagem</button></div>'; $('copyReport').onclick=()=>navigator.clipboard.writeText(reportText()).then(()=>message('Relatório copiado'));$('downloadReport').onclick=()=>{let blob=new Blob([reportText()],{type:'text/plain;charset=utf-8'}),a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='relatorio-semanal-crm.txt';a.click();setTimeout(()=>URL.revokeObjectURL(a.href),2000)};$('copyMessage').onclick=()=>navigator.clipboard.writeText('Olá, tudo bem? Gostaria de saber se você conseguiu avaliar nossa proposta comercial. Estou à disposição para esclarecer dúvidas sobre valores, prazos ou especificações. Podemos conversar?').then(()=>message('Mensagem copiada'))}

// V3: análise determinística e auditável. Não usa API de IA generativa.
function quoteContact(o){return data.acompanhamentos.filter(a=>a.orcamento_id===o.id).sort((a,b)=>String(b.data_contato).localeCompare(String(a.data_contato)))[0]}
function priorityScore(o){let score=0,why=[];const last=quoteContact(o);if(o.prioridade==='alta'){score+=15;why.push('prioridade manual alta')}if(o.prioridade==='baixa'){score-=10;why.push('prioridade manual baixa')}if(o.proximo_contato&&o.proximo_contato<today()){score+=50;why.push('retorno vencido')}if(!last&&!o.ultimo_contato&&days(o.data_orcamento)>=5){score+=35;why.push('sem contato registrado há '+days(o.data_orcamento)+' dias')}if((last||o.ultimo_contato)&&days([String(last?.data_contato||'').slice(0,10),o.ultimo_contato||''].sort().at(-1))>=7){score+=25;why.push('último contato há '+days(String(last.data_contato).slice(0,10))+' dias')}if(Number(o.valor)>=1000){score+=10;why.push('valor acima de R$ 1.000 (critério ajustável)')}return {score,why}}
function priorityList(){return data.orcamentos.filter(o=>['pendente','negociacao'].includes(o.status)).map(o=>({...o,_p:priorityScore(o)})).sort((a,b)=>b._p.score-a._p.score||Number(b.valor)-Number(a.valor))}
function statsSummary(){const q=data.orcamentos,v=data.vendas,approved=q.filter(o=>o.status==='aprovado'),lost=q.filter(o=>o.status==='perdido'),pending=priorityList(),value=q.reduce((s,o)=>s+Number(o.valor||0),0),sold=v.reduce((s,o)=>s+Number(o.valor||0),0);return {q,v,approved,lost,pending,value,sold,rate:q.length?approved.length/q.length*100:null}}
function assistantAnswer(question){const s=statsSummary(),p=priorityList(),t=question.toLowerCase();let lines=[];
if(/mensagem|whatsapp|e-mail|email|abordagem/.test(t)){const o=p[0];if(!o)return 'Não há orçamentos pendentes para personalizar uma abordagem. Cadastre uma proposta ou selecione um cliente.';return 'Sugestão para revisão (não enviada):\n\nOlá! Tudo bem? Gostaria de confirmar se conseguiu analisar nossa proposta '+(o.numero_tiny||'')+' referente a '+(o.produto||'seu pedido')+'. Caso tenha alguma dúvida sobre especificações, valores ou prazo, fico à disposição. Podemos conversar?\n\nCliente: '+clientName(o.cliente_id)+'. Valor cadastrado: '+money(o.valor)+'. Verifique as condições antes de enviar.'}
if(/preço|preco|valor|faixa|categoria/.test(t)){const groups={};for(const o of s.q){const k=(o.produto||'Sem categoria').trim().toLowerCase();(groups[k]??=[]).push(o)}lines.push('Análise por categoria (valores orçados, não preços de mercado):');for(const [k,a] of Object.entries(groups)){const vals=a.map(o=>Number(o.valor)).sort((x,y)=>x-y),ap=a.filter(o=>o.status==='aprovado').length;lines.push('• '+k+': '+a.length+' proposta(s), mínimo '+money(vals[0])+', máximo '+money(vals.at(-1))+', aprovadas '+ap+'.')}if(!s.q.length)lines.push('Não há orçamentos cadastrados.');lines.push('Limitação: produtos, quantidades e especificações diferentes não devem ser comparados como preços equivalentes. Não há custos ou margens registrados.');return lines.join('\n')}
if(/semana|relat[oó]rio|resultado/.test(t)){return reportText()+'\n\nAtenção: vendas registradas e aprovações de orçamento são indicadores diferentes; não atribuo causalidade sem histórico.'}
if(/queda|diminu|pior|melhor|convers|desempenho/.test(t)){lines.push('Diagnóstico com base nos registros atuais: '+s.q.length+' orçamento(s), '+s.approved.length+' aprovado(s), '+s.lost.length+' perdido(s), '+s.pending.length+' em aberto e '+s.v.length+' pedido(s).');lines.push('Taxa de aprovação de orçamentos: '+(s.rate===null?'sem base':s.rate.toFixed(1).replace('.',',')+'%')+'. Valor vendido registrado: '+money(s.sold)+'.');lines.push(s.q.length<10?'A amostra é pequena; não é confiável concluir tendência ou queda de desempenho.':'Compare períodos equivalentes e registre motivos de perda para investigar causas.');return lines.join('\n')}
lines.push('Oportunidades prioritárias ('+p.length+' em aberto):');if(!p.length)lines.push('Nenhuma proposta pendente ou em negociação.');for(const o of p.slice(0,6)){lines.push('• '+clientName(o.cliente_id)+' — '+(o.numero_tiny||'sem número')+' — '+money(o.valor)+' — '+(o._p.why.join(', ')||'sem alerta objetivo; ordenado por valor')+'.')}
lines.push('Critérios: retorno vencido, ausência de contato, tempo desde último contato e valor. Pontuação é uma regra de organização, não previsão de compra.');return lines.join('\n')}
let chatHistory=[];
function renderAssistant(){const s=statsSummary(),p=priorityList();$('assistente').innerHTML='<div class="card"><h2>Assistente comercial — análises fundamentadas</h2><p class="assistantnote">Versão 3.2: respostas automáticas calculadas a partir dos registros carregados do Supabase. Ainda não é uma IA generativa. Não inventa probabilidades, preços de mercado ou causas de perdas.</p><div class="chipbar">'+[['Quais clientes devo contatar hoje?','prioridades'],['Por que minha conversão está baixa?','conversão'],['Analise os preços por categoria','preços'],['Prepare mensagem de WhatsApp','mensagem'],['Gere o relatório semanal','relatório']].map(([a,b])=>'<button type="button" class="secondary" data-question="'+b+'">'+a+'</button>').join('')+'</div><div class="chatlog" id="chatlog" aria-live="polite">'+(chatHistory.length?chatHistory.map(m=>'<div class="bubble '+(m.role==='me'?'me':'')+'">'+esc(m.text)+'</div>').join(''):'<div class="bubble">Olá! Posso avaliar prioridades, acompanhamento, conversão, preços cadastrados e preparar mensagens. Minhas respostas indicam limitações dos dados.</div>')+'</div><form id="chatForm" class="row"><input id="chatQuestion" style="flex:1;min-width:190px" maxlength="350" placeholder="Pergunte sobre seus orçamentos e vendas..." aria-label="Pergunta ao assistente" required><button>Consultar</button></form></div><div class="card"><h2>Prioridades justificadas</h2>'+(!p.length?'<p>Nenhuma oportunidade em aberto.</p>':p.slice(0,8).map(o=>'<div class="priority '+(o._p.score>=50?'high':'')+'"><b>'+esc(clientName(o.cliente_id))+' — '+esc(o.numero_tiny||'sem número')+'</b> • '+money(o.valor)+'<p>'+esc(o._p.why.join('; ')||'Sem atraso ou ausência de contato identificados')+'</p></div>').join(''))+'</div><div class="card"><h2>Qualidade dos dados</h2><p>'+s.q.length+' orçamento(s) cadastrados; '+s.q.filter(o=>!o.produto).length+' sem categoria; '+s.lost.filter(o=>!o.motivo_perda).length+' perda(s) sem motivo registrado.</p><p class="assistantnote">Sem motivos de perda, custos e preços de produtos equivalentes, não é possível afirmar que preço é a causa de baixa conversão.</p></div>';
$('chatForm').onsubmit=e=>{e.preventDefault();askAssistant($('chatQuestion').value)};document.querySelectorAll('[data-question]').forEach(b=>b.onclick=()=>askAssistant(b.dataset.question));const log=$('chatlog');log.scrollTop=log.scrollHeight}
function askAssistant(q){q=String(q||'').trim();if(!q)return;chatHistory.push({role:'me',text:q},{role:'bot',text:assistantAnswer(q)});chatHistory=chatHistory.slice(-20);renderAssistant()}
const oldDashboard=renderDashboard;
renderDashboard=function(){oldDashboard();const p=priorityList(),s=statsSummary();const node=document.createElement('div');node.className='card';node.innerHTML='<h2>Diagnóstico comercial 3.2</h2><p class="assistantnote">Regras transparentes, sem IA generativa nesta etapa.</p><p><b>'+p.filter(o=>o._p.score>=50).length+'</b> oportunidade(s) com prioridade alta por atraso ou falta de contato; <b>'+s.lost.length+'</b> orçamento(s) perdido(s).</p><p>'+esc(s.q.length<10?'Amostra pequena: evite tirar conclusões sobre tendências de conversão.':'Registre os motivos de perda para identificar padrões confiáveis.')+'</p><button type="button" id="goAssistant">Abrir assistente e recomendações</button>';$('dashboard').insertBefore(node,$('dashboard').children[1]||null);$('goAssistant').onclick=()=>show('assistente')}

function extraDiagnosis31(){const q=data.orcamentos,opened=q.filter(o=>['pendente','negociacao'].includes(o.status)),lost=q.filter(o=>o.status==='perdido');const overdue=opened.filter(o=>o.proximo_contato&&o.proximo_contato<today()),missing=opened.filter(o=>!o.proximo_contato&&!o.ultimo_contato&&!quoteContact(o));const counts={};for(const o of lost){const k=o.motivo_perda_categoria||'não informado';counts[k]=(counts[k]||0)+1}const reasons=Object.entries(counts).sort((a,b)=>b[1]-a[1]).map(([k,v])=>esc(k)+': '+v).join('; ')||'Nenhuma perda registrada';return '<div class="card"><h2>Alertas e perdas • CRM 3.2</h2><p><b>'+overdue.length+'</b> retorno(s) vencido(s); <b>'+missing.length+'</b> proposta(s) abertas sem data de retorno ou contato registrado.</p><p><b>Motivos de perda:</b> '+reasons+'.</p><p class="assistantnote">Contagens baseadas nos registros, sem inferir causas de perdas. Prioridade manual não prevê vendas.</p></div>'}
const dashboard31=renderDashboard;renderDashboard=function(){dashboard31();$('dashboard').insertAdjacentHTML('beforeend',extraDiagnosis31())};const assistant31=renderAssistant;renderAssistant=function(){assistant31();$('assistente').insertAdjacentHTML('beforeend',extraDiagnosis31())};

function profitability32(){
 const valid=data.orcamentos.filter(o=>o.custo_estimado!==null&&o.custo_estimado!==undefined&&o.custo_estimado!==''&&Number.isFinite(Number(o.custo_estimado))&&Number(o.valor)>0);
 const issues=valid.filter(o=>Number(o.custo_estimado)>Number(o.valor));
 const zero=valid.filter(o=>Number(o.custo_estimado)===Number(o.valor));
 const gross=valid.reduce((s,o)=>s+Number(o.valor)-Number(o.custo_estimado),0);
 const sales=valid.reduce((s,o)=>s+Number(o.valor),0);
 const missing=data.orcamentos.length-valid.length;
 return {valid,issues,zero,gross,sales,missing,margin:sales?gross/sales*100:null};
}
function financialPanel32(){
 const p=profitability32();
 const rows=p.issues.slice(0,6).map(o=>'<div class="item"><b>'+esc(clientName(o.cliente_id))+' — '+esc(o.numero_tiny||'sem número')+'</b>: orçamento '+money(o.valor)+'; custo '+money(o.custo_estimado)+'; diferença '+money(Number(o.valor)-Number(o.custo_estimado))+'</div>').join('');
 return '<div class="card"><h2>Rentabilidade estimada • CRM 3.2</h2><div class="grid">'+
 kpi('Com custo informado',p.valid.length)+kpi('Sem custo comparável',p.missing)+kpi('Diferença preço − custo',money(p.gross))+kpi('Margem estimada agregada',p.margin===null?'Sem base':p.margin.toFixed(1).replace('.',',')+'%')+
 '</div><p class="assistantnote">Cálculo sobre orçamentos com preço positivo e custo preenchido. Não é lucro realizado; não inclui necessariamente impostos, frete, despesas indiretas ou descontos. Propostas pendentes também entram na estimativa.</p>'+
 (p.issues.length?'<div class="notice"><b>Atenção:</b> '+p.issues.length+' orçamento(s) com custo maior que preço.</div>'+rows:'<p class="good">Nenhum custo superior ao preço entre os registros comparáveis.</p>')+
 (p.zero.length?'<p>'+p.zero.length+' orçamento(s) com preço igual ao custo informado.</p>':'')+'</div>';
}
const dashboard32=renderDashboard;
renderDashboard=function(){dashboard32();$('dashboard').insertAdjacentHTML('beforeend',financialPanel32())};
const assistant32=renderAssistant;
renderAssistant=function(){assistant32();$('assistente').insertAdjacentHTML('beforeend',financialPanel32())};
const report32=renderReport;
renderReport=function(){report32();$('relatorio').insertAdjacentHTML('beforeend',financialPanel32())};
const assistantAnswer32=assistantAnswer;
assistantAnswer=function(question){
 const t=String(question||'').toLowerCase();
 if(/margem|rentabil|lucro|custo|preju[ií]zo/.test(t)){
  const p=profitability32();
  return 'Análise de preço e custo cadastrados:\n'+p.valid.length+' orçamento(s) comparável(is), '+p.missing+' sem custo ou preço positivo, '+p.issues.length+' com custo superior ao preço e '+p.zero.length+' com preço igual ao custo.\nDiferença agregada entre preços e custos: '+money(p.gross)+'. Margem agregada estimada: '+(p.margin===null?'sem base':p.margin.toFixed(1).replace('.',',')+'%')+'.\nIsso não é lucro líquido nem venda realizada. Os valores não comprovam que preço é a causa de uma perda.';
 }
 if(/perda|perdido|concorr[eê]n|prazo/.test(t)){
  const lost=data.orcamentos.filter(o=>o.status==='perdido');
  const groups={};for(const o of lost){const k=o.motivo_perda_categoria||'não informado';groups[k]=(groups[k]||0)+1}
  return 'Perdas registradas: '+lost.length+'.\n'+(Object.entries(groups).map(([k,v])=>k+': '+v).join('\n')||'Nenhum orçamento marcado como perdido.')+'\nMotivos cadastrados são relatos, não comprovação de causalidade. Sem histórico suficiente, não é possível afirmar qual fator mais prejudica as vendas.';
 }
 return assistantAnswer32(question);
};
