function reportText(){let end=new Date(today()+'T12:00:00'),start=new Date(end);start.setDate(end.getDate()-6);let future=new Date(end);future.setDate(end.getDate()+6);let d0=start.toLocaleDateString('en-CA'),d1=today(),d2=future.toLocaleDateString('en-CA'),q=data.orcamentos.filter(o=>o.data_orcamento>=d0&&o.data_orcamento<=d1),v=data.vendas.filter(o=>o.data_venda>=d0&&o.data_venda<=d1),open=data.orcamentos.filter(o=>['pendente','negociacao'].includes(o.status)),overdue=open.filter(o=>o.proximo_contato&&o.proximo_contato<d1),todayContacts=open.filter(o=>o.proximo_contato===d1),next=open.filter(o=>o.proximo_contato&&o.proximo_contato>d1&&o.proximo_contato<=d2).sort((a,b)=>String(a.proximo_contato).localeCompare(String(b.proximo_contato))),without=open.filter(o=>!o.proximo_contato),win=q.filter(o=>o.status==='aprovado').length,a=analysis();let agenda=next.slice(0,8).map(o=>'• '+day(o.proximo_contato)+' — '+clientName(o.cliente_id)+' — '+(o.numero_tiny||'sem número')+' — '+money(o.valor)).join('\n');return 'RELATÓRIO SEMANAL — '+empresaNome()+' — '+day(d0)+' a '+day(d1)+'\n\nRESULTADOS DA SEMANA\nOrçamentos incluídos: '+q.length+' | Valor: '+money(q.reduce((s,o)=>s+Number(o.valor),0))+'\nPedidos: '+v.length+' | Valor: '+money(v.reduce((s,o)=>s+Number(o.valor),0))+'\nAproveitamento das propostas incluídas na semana (status atual aprovado): '+(q.length?(win/q.length*100).toFixed(1):'0')+'%\n\nACOMPANHAMENTO PARA FECHAMENTO\nEm aberto: '+open.length+'\nPróximo contato hoje: '+todayContacts.length+'\nRetornos vencidos: '+overdue.length+'\nSem próximo contato definido: '+without.length+'\nPróximos contatos em até 7 dias: '+next.length+(agenda?'\n'+agenda:'')+'\n\nAÇÕES RECOMENDADAS\n'+a.notes.map((n,i)=>(i+1)+'. '+n).join('\n')+'\n\nObservação: a data do orçamento mede quando a proposta foi incluída; o próximo contato organiza o acompanhamento comercial. O histórico de contatos continua sendo registrado na aba Acompanhamentos.'}

// V3: análise determinística e auditável. Não usa API de IA generativa.
function quoteContact(o){return data.acompanhamentos.filter(a=>a.orcamento_id===o.id).sort((a,b)=>String(b.data_contato).localeCompare(String(a.data_contato)))[0]}
function priorityScore(o){let score=0,why=[];const last=quoteContact(o);if(o.prioridade==='alta'){score+=15;why.push('prioridade manual alta')}if(o.prioridade==='baixa'){score-=10;why.push('prioridade manual baixa')}if(o.proximo_contato&&o.proximo_contato<today()){score+=50;why.push('retorno vencido')}if(!last&&days(o.data_orcamento)>=5){score+=35;why.push('sem acompanhamento registrado há '+days(o.data_orcamento)+' dias')}if(last&&days(String(last.data_contato).slice(0,10))>=7){score+=25;why.push('último acompanhamento há '+days(String(last.data_contato).slice(0,10))+' dias')}if(Number(o.valor)>=1000){score+=10;why.push('valor acima de R$ 1.000 (critério ajustável)')}return {score,why}}
function priorityList(){return data.orcamentos.filter(o=>['pendente','negociacao'].includes(o.status)).map(o=>({...o,_p:priorityScore(o)})).sort((a,b)=>b._p.score-a._p.score||Number(b.valor)-Number(a.valor))}
function statsSummary(){const q=data.orcamentos,v=data.vendas,approved=q.filter(o=>o.status==='aprovado'),lost=q.filter(o=>o.status==='perdido'),pending=priorityList(),value=q.reduce((s,o)=>s+Number(o.valor||0),0),sold=v.reduce((s,o)=>s+Number(o.valor||0),0);return {q,v,approved,lost,pending,value,sold,rate:q.length?approved.length/q.length*100:null}}
function assistantAnswer(question){const s=statsSummary(),p=priorityList(),t=question.toLowerCase();let lines=[];
if(/mensagem|whatsapp|e-mail|email|abordagem/.test(t)){const o=p[0];if(!o)return 'Não há orçamentos pendentes para personalizar uma abordagem. Cadastre uma proposta ou selecione um cliente.';return 'Sugestão para revisão (não enviada):\n\nOlá! Tudo bem? Gostaria de confirmar se conseguiu analisar nossa proposta '+(o.numero_tiny||'')+' referente a '+(o.produto||'seu pedido')+'. Caso tenha alguma dúvida sobre especificações, valores ou prazo, fico à disposição. Podemos conversar?\n\nCliente: '+clientName(o.cliente_id)+'. Valor cadastrado: '+money(o.valor)+'. Verifique as condições antes de enviar.'}
if(/preço|preco|valor|faixa|categoria/.test(t)){const groups={};for(const o of s.q){const k=(o.produto||'Sem categoria').trim().toLowerCase();(groups[k]??=[]).push(o)}lines.push('Análise por categoria (valores orçados, não preços de mercado):');for(const [k,a] of Object.entries(groups)){const vals=a.map(o=>Number(o.valor)).sort((x,y)=>x-y),ap=a.filter(o=>o.status==='aprovado').length;lines.push('• '+k+': '+a.length+' proposta(s), mínimo '+money(vals[0])+', máximo '+money(vals.at(-1))+', aprovadas '+ap+'.')}if(!s.q.length)lines.push('Não há orçamentos cadastrados.');lines.push('Limitação: produtos, quantidades e especificações diferentes não devem ser comparados como preços equivalentes. Não há custos ou margens registrados.');return lines.join('\n')}
if(/semana|relat[oó]rio|resultado/.test(t)){return reportText()+'\n\nAtenção: vendas registradas e aprovações de orçamento são indicadores diferentes; não atribuo causalidade sem histórico.'}
if(/queda|diminu|pior|melhor|convers|desempenho/.test(t)){lines.push('Diagnóstico com base nos registros atuais: '+s.q.length+' orçamento(s), '+s.approved.length+' aprovado(s), '+s.lost.length+' perdido(s), '+s.pending.length+' em aberto e '+s.v.length+' pedido(s).');lines.push('Taxa de aprovação de orçamentos: '+(s.rate===null?'sem base':s.rate.toFixed(1).replace('.',',')+'%')+'. Valor vendido registrado: '+money(s.sold)+'.');lines.push(s.q.length<10?'A amostra é pequena; não é confiável concluir tendência ou queda de desempenho.':'Compare períodos equivalentes e registre motivos de perda para investigar causas.');return lines.join('\n')}
lines.push('Oportunidades prioritárias ('+p.length+' em aberto):');if(!p.length)lines.push('Nenhuma proposta pendente ou em negociação.');for(const o of p.slice(0,6)){lines.push('• '+clientName(o.cliente_id)+' — '+(o.numero_tiny||'sem número')+' — '+money(o.valor)+' — '+(o._p.why.join(', ')||'sem alerta objetivo; ordenado por valor')+'.')}
lines.push('Critérios: retorno vencido, ausência de contato, tempo desde último contato e valor. Pontuação é uma regra de organização, não previsão de compra.');return lines.join('\n')}

otivos de perda, custos e preços de produtos equivalentes, não é possível afirmar que preço é a causa de baixa conversão.</p></div>';

function extraDiagnosis31(){const q=data.orcamentos,opened=q.filter(o=>['pendente','negociacao'].includes(o.status)),lost=q.filter(o=>o.status==='perdido');const overdue=opened.filter(o=>o.proximo_contato&&o.proximo_contato<today()),missing=opened.filter(o=>!o.proximo_contato&&!o.ultimo_contato&&!quoteContact(o));const counts={};for(const o of lost){const k=o.motivo_perda_categoria||'não informado';counts[k]=(counts[k]||0)+1}const reasons=Object.entries(counts).sort((a,b)=>b[1]-a[1]).map(([k,v])=>esc(k)+': '+v).join('; ')||'Nenhuma perda registrada';return '<div class="card"><h2>Alertas e perdas • CRM 3.4</h2><p><b>'+overdue.length+'</b> retorno(s) vencido(s); <b>'+missing.length+'</b> proposta(s) abertas sem data de retorno ou contato registrado.</p><p><b>Motivos de perda:</b> '+reasons+'.</p><p class="assistantnote">Contagens baseadas nos registros, sem inferir causas de perdas. Prioridade manual não prevê vendas.</p></div>'}
const dashboard31=renderDashboard;renderDashboard=function(){dashboard31();$('dashboard').insertAdjacentHTML('beforeend',extraDiagnosis31())};const assistant31=renderAssistant;renderAssistant=function(){assistant31();$('assistente').insertAdjacentHTML('beforeend',extraDiagnosis31())};

function profitability32(){
 const valid=data.orcamentos.filter(o=>o.custo_estimado!==null&&o.custo_estimado!==undefined&&o.custo_estimado!==''&&Number.isFinite(Number(o.custo_estimado))&&Number(o.valor)>0);
 const issues=valid.filter(o=>Number(o.custo_estimado)>Number(o.valor));
 const zero=valid.filter(o=>Number(o.custo_estimado)===Number(o.valor));
 const gross=valid.reduce((s,o)=>s+Number(o.valor)-Number(o.custo_estimado),0);
 const sales=valid.reduce((s,o)=>s+Number(o.valor),0);
 const missing=data.orcamentos.length-valid.length;
 return {valid,issues,zero,gross,sales,missing,margin:sales?gross/sales*100:null};
}
function financialPanel32(){
 const p=profitability32();
 const rows=p.issues.slice(0,6).map(o=>'<div class="item"><b>'+esc(clientName(o.cliente_id))+' — '+esc(o.numero_tiny||'sem número')+'</b>: orçamento '+money(o.valor)+'; custo '+money(o.custo_estimado)+'; diferença '+money(Number(o.valor)-Number(o.custo_estimado))+'</div>').join('');
 return '<div class="card"><h2>Rentabilidade estimada • CRM 3.4</h2><div class="grid">'+
 kpi('Com custo informado',p.valid.length)+kpi('Sem custo comparável',p.missing)+kpi('Diferença preço − custo',money(p.gross))+kpi('Margem estimada agregada',p.margin===null?'Sem base':p.margin.toFixed(1).replace('.',',')+'%')+
 '</div><p class="assistantnote">Cálculo sobre orçamentos com preço positivo e custo preenchido. Não é lucro realizado; não inclui necessariamente impostos, frete, despesas indiretas ou descontos. Propostas pendentes também entram na estimativa.</p>'+
 (p.issues.length?'<div class="notice"><b>Atenção:</b> '+p.issues.length+' orçamento(s) com custo maior que preço.</div>'+rows:'<p class="good">Nenhum custo superior ao preço entre os registros comparáveis.</p>')+
 (p.zero.length?'<p>'+p.zero.length+' orçamento(s) com preço igual ao custo informado.</p>':'')+'</div>';
}

const assistantAnswer32=assistantAnswer;
assistantAnswer=function(question){
 const t=String(question||'').toLowerCase();
 if(/margem|rentabil|lucro|custo|preju[ií]zo/.test(t)){
  const p=profitability32();
  return 'Análise de preço e custo cadastrados:\n'+p.valid.length+' orçamento(s) comparável(is), '+p.missing+' sem custo ou preço positivo, '+p.issues.length+' com custo superior ao preço e '+p.zero.length+' com preço igual ao custo.\nDiferença agregada entre preços e custos: '+money(p.gross)+'. Margem agregada estimada: '+(p.margin===null?'sem base':p.margin.toFixed(1).replace('.',',')+'%')+'.\nIsso não é lucro líquido nem venda realizada. Os valores não comprovam que preço é a causa de uma perda.';
 }
 if(/perda|perdido|concorr[eê]n|prazo/.test(t)){
  const lost=data.orcamentos.filter(o=>o.status==='perdido');
  const groups={};for(const o of lost){const k=o.motivo_perda_categoria||'não informado';groups[k]=(groups[k]||0)+1}
  return 'Perdas registradas: '+lost.length+'.\n'+(Object.entries(groups).map(([k,v])=>k+': '+v).join('\n')||'Nenhum orçamento marcado como perdido.')+'\nMotivos cadastrados são relatos, não comprovação de causalidade. Sem histórico suficiente, não é possível afirmar qual fator mais prejudica as vendas.';
 }
 return assistantAnswer32(question);
};

/* Histórico Comercial 3.4 — consultas paginadas e isoladas por empresa no Supabase. */
let history33Request=0,history33Records={orcamentos:[],vendas:[]};
const history33State={period:'mes',date:today(),month:today().slice(0,7),year:today().slice(0,4),start:today().slice(0,7)+'-01',end:today(),kind:'todos',search:'',status:'todos'};
function history33Bounds(){
 const h=history33State;
 if(h.period==='dia')return [h.date,h.date];
 if(h.period==='mes'){const [y,m]=h.month.split('-').map(Number);return [h.month+'-01',new Date(y,m,0).toLocaleDateString('en-CA')]}
 if(h.period==='ano')return [h.year+'-01-01',h.year+'-12-31'];
 return [h.start,h.end];
}
function history33Fields(){
 const h=history33State;
 return '<div class="formgrid"><div><label>Período</label><select id="h33period"><option value="dia">Dia</option><option value="mes">Mês</option><option value="ano">Ano</option><option value="personalizado">Personalizado</option></select></div>'+
 (h.period==='dia'?'<div><label>Data</label><input type="date" id="h33date" value="'+esc(h.date)+'"></div>':
 h.period==='mes'?'<div><label>Mês</label><input type="month" id="h33month" value="'+esc(h.month)+'"></div>':
 h.period==='ano'?'<div><label>Ano</label><input type="number" min="2000" max="2100" id="h33year" value="'+esc(h.year)+'"></div>':
 '<div><label>Data inicial</label><input type="date" id="h33start" value="'+esc(h.start)+'"></div><div><label>Data final</label><input type="date" id="h33end" value="'+esc(h.end)+'"></div>')+
 '<div><label>Tipo de registro</label><select id="h33kind"><option value="todos">Orçamentos e vendas</option><option value="orcamentos">Somente orçamentos</option><option value="vendas">Somente vendas</option></select></div>'+
 '<div><label>Cliente ou número</label><input id="h33search" placeholder="Buscar nos resultados" value="'+esc(h.search)+'"></div>'+
 '<div><label>Situação do orçamento</label><select id="h33status"><option value="todos">Todas</option><option value="pendente">Pendente</option><option value="negociacao">Negociação</option><option value="aprovado">Aprovado</option><option value="perdido">Perdido</option></select></div></div><div class="formactions"><button id="h33apply" type="button">Aplicar filtros</button></div>';
}
function history33Wire(){
 const h=history33State;
 for(const [id,key] of [['h33period','period'],['h33date','date'],['h33month','month'],['h33year','year'],['h33start','start'],['h33end','end'],['h33kind','kind'],['h33search','search'],['h33status','status']]){
  const el=$(id);if(!el)continue;
  if(el.tagName==='SELECT')el.value=h[key];
  el.onchange=()=>{h[key]=el.value;if(key==='period'){renderHistory33();return}};
 }
 $('h33apply').onclick=()=>{for(const [id,key] of [['h33search','search'],['h33kind','kind'],['h33status','status']]){if($(id))h[key]=$(id).value}loadHistory33()};
}
function renderHistory33(){
 const el=$('historico');if(!el)return;
 el.innerHTML='<div class="card"><h2>Histórico Comercial • 3.4</h2><p class="muted">Consulte orçamentos e vendas pela data registrada. Empresa ativa: <b>'+esc(empresaNome())+'</b>. Os indicadores consideram apenas os registros encontrados no período.</p>'+history33Fields()+'</div><div id="h33result" class="card"><p>Selecione um período e clique em Aplicar filtros.</p></div>';
 history33Wire();
}
async function history33All(table,column,start,end,empresaId){
 const result=[];const page=500;
 for(let offset=0;;offset+=page){
  if(empresaId!==empresaAtual)throw Error('Empresa alterada durante a consulta.');
  const {data:rows,error}=await sb.from(table).select('*').eq('empresa_id',empresaId).gte(column,start).lte(column,end).order(column,{ascending:false}).order('id',{ascending:true}).range(offset,offset+page-1);
  if(error)throw Error(table+': '+error.message);
  result.push(...(rows||[]));if(!rows||rows.length<page)break;
  if(offset>=99500)throw Error('Consulta muito grande; escolha um intervalo menor.');
 }
 return result;
}
async function loadHistory33(){
 const token=++history33Request,empresaId=empresaAtual,[start,end]=history33Bounds(),el=$('h33result');
 if(!start||!end||start>end){el.innerHTML='<p class="bad">Informe um intervalo válido de datas.</p>';return}
 el.innerHTML='<p>Consultando registros no Supabase...</p>';
 try{
  const [quotes,sales]=await Promise.all([history33All('orcamentos','data_orcamento',start,end,empresaId),history33All('vendas','data_venda',start,end,empresaId)]);
  if(token!==history33Request||empresaId!==empresaAtual)return;
  history33Records={orcamentos:quotes,vendas:sales};
  await history33Display(token,empresaId);
 }catch(e){if(token===history33Request&&empresaId===empresaAtual)el.innerHTML='<p class="bad">'+esc(e.message)+'</p>'}
}
async function history33Display(token=history33Request,empresaId=empresaAtual){if(token!==history33Request||empresaId!==empresaAtual)return;
 const h=history33State,term=h.search.trim().toLocaleLowerCase('pt-BR'),q=history33Records.orcamentos,v=history33Records.vendas;
 const ids=[...new Set([...q.map(o=>o.cliente_id),...v.map(x=>q.find(o=>o.id===x.orcamento_id)?.cliente_id).filter(Boolean)])];
 const names=new Map(data.clientes.map(c=>[c.id,c.empresa]));
 for(let i=0;i<ids.length;i+=100){
  const missing=ids.slice(i,i+100).filter(id=>!names.has(id));
  if(missing.length){const {data:clients,error}=await sb.from('clientes').select('id,empresa').eq('empresa_id',empresaId).in('id',missing);if(!error)(clients||[]).forEach(c=>names.set(c.id,c.empresa))}
 }
 const quoteById=new Map(q.map(o=>[o.id,o]));
 const clientFor=o=>names.get(o.cliente_id)||'Cliente não identificado';
 const saleClient=x=>{const o=quoteById.get(x.orcamento_id)||data.orcamentos.find(z=>z.id===x.orcamento_id);return o?clientFor(o):'Sem orçamento vinculado'};
 const fq=q.filter(o=>(h.status==='todos'||o.status===h.status)&&(!term||[clientFor(o),o.numero_tiny,o.produto,o.status].some(x=>String(x||'').toLocaleLowerCase('pt-BR').includes(term))));
 const fv=v.filter(x=>!term||[saleClient(x),x.numero_pedido_tiny].some(z=>String(z||'').toLocaleLowerCase('pt-BR').includes(term)));
 const showQ=h.kind!=='vendas',showV=h.kind!=='orcamentos';
 const rows=[...(showQ?fq.map(o=>({type:'Orçamento',date:o.data_orcamento,client:clientFor(o),number:o.numero_tiny,status:o.status,value:o.valor})):[]),
 ...(showV?fv.map(x=>({type:'Venda',date:x.data_venda,client:saleClient(x),number:x.numero_pedido_tiny,status:'—',value:x.valor})):[])].sort((a,b)=>String(b.date).localeCompare(String(a.date)));
 const sum=arr=>arr.reduce((t,o)=>t+Number(o.valor||0),0);
 const html='<div class="grid">'+kpi('Orçamentos',showQ?fq.length:'—')+kpi('Valor orçado',showQ?money(sum(fq)):'—')+kpi('Vendas',showV?fv.length:'—')+kpi('Valor vendido',showV?money(sum(fv)):'—')+'</div>'+
 '<p class="muted">Taxa de conversão não calculada: a data de venda e a data do orçamento podem pertencer a períodos diferentes. Filtros de situação aplicam-se apenas aos orçamentos.</p>'+
 '<p><b>'+rows.length+'</b> registro(s) encontrado(s).</p>'+
 '<div class="tablewrap"><table><thead><tr><th>Tipo</th><th>Data</th><th>Cliente</th><th>Número Tiny</th><th>Situação</th><th>Valor</th></tr></thead><tbody>'+
 (rows.length?rows.map(x=>'<tr><td>'+esc(x.type)+'</td><td>'+day(x.date)+'</td><td>'+esc(x.client)+'</td><td>'+esc(x.number||'—')+'</td><td>'+esc(x.status||'—')+'</td><td>'+money(x.value)+'</td></tr>').join(''):'<tr><td colspan="6">Nenhum registro encontrado.</td></tr>')+
 '</tbody></table></div>';
 if(token!==history33Request||empresaId!==empresaAtual)return;$('h33result').innerHTML=html;
}
const originalShow33=show;
show=function(t){originalShow33(t);if(t==='historico'&&!$('h33result'))renderHistory33()};
renderHistory33();
</script></body></html>
