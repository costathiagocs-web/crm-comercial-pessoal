name: CRM 3.4 hardening

on:
  push:
    branches:
      - desenvolvimento-3.4-multiempresa
  workflow_dispatch:

permissions:
  contents: write

jobs:
  harden:
    if: ${{ !contains(github.event.head_commit.message || '', '[skip crm34-hardening]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: desenvolvimento-3.4-multiempresa
          fetch-depth: 0

      - name: Reforcar isolamento e paginacao
        shell: python
        run: |
          from pathlib import Path

          path = Path('index.html')
          s = path.read_text(encoding='utf-8')

          old_refresh = "async function refresh(){const token=++carregamentoEmpresa,id=empresaAtual;if(!id)return;try{const novos={};for(const table of Object.keys(data)){const {data:rows,error}=await sb.from(table).select('*').eq('empresa_id',id).order('criado_em',{ascending:false}).limit(1000);if(error)throw Error(table+': '+error.message);novos[table]=rows||[];if(token!==carregamentoEmpresa)return}if(token!==carregamentoEmpresa)return;data=novos;render()}catch(e){if(token===carregamentoEmpresa)message('Erro ao carregar registros: '+e.message,true)}}"
          new_refresh = """async function tabelaEmpresaCompleta(table,empresaId){const result=[];const page=500;for(let offset=0;;offset+=page){const {data:rows,error}=await sb.from(table).select('*').eq('empresa_id',empresaId).order('criado_em',{ascending:false}).order('id',{ascending:true}).range(offset,offset+page-1);if(error)throw Error(table+': '+error.message);result.push(...(rows||[]));if(!rows||rows.length<page)break;if(offset>=99500)throw Error(table+': volume muito grande; refine os dados ou implemente arquivamento.')}return result}
          async function refresh(){const token=++carregamentoEmpresa,id=empresaAtual;if(!id)return;try{const pares=await Promise.all(Object.keys(data).map(async table=>[table,await tabelaEmpresaCompleta(table,id)]));if(token!==carregamentoEmpresa||id!==empresaAtual)return;data=Object.fromEntries(pares);render()}catch(e){if(token===carregamentoEmpresa&&id===empresaAtual)message('Erro ao carregar registros: '+e.message,true)}}"""
          if old_refresh not in s:
              raise SystemExit('Trecho refresh esperado nao encontrado; nenhuma alteracao aplicada.')
          s = s.replace(old_refresh, new_refresh, 1)

          old_hist = """async function history33All(table,column,start,end){
           const result=[];const page=500;
           for(let offset=0;;offset+=page){
            const {data:rows,error}=await sb.from(table).select('*').eq('empresa_id',empresaAtual).gte(column,start).lte(column,end).order(column,{ascending:false}).order('id',{ascending:true}).range(offset,offset+page-1);
            if(error)throw Error(table+': '+error.message);
            result.push(...(rows||[]));if(!rows||rows.length<page)break;
            if(offset>=99500)throw Error('Consulta muito grande; escolha um intervalo menor.');
           }
           return result;
          }"""
          new_hist = """async function history33All(table,column,start,end,empresaId){
           const result=[];const page=500;
           for(let offset=0;;offset+=page){
            if(empresaId!==empresaAtual)throw Error('Empresa alterada durante a consulta.');
            const {data:rows,error}=await sb.from(table).select('*').eq('empresa_id',empresaId).gte(column,start).lte(column,end).order(column,{ascending:false}).order('id',{ascending:true}).range(offset,offset+page-1);
            if(error)throw Error(table+': '+error.message);
            result.push(...(rows||[]));if(!rows||rows.length<page)break;
            if(offset>=99500)throw Error('Consulta muito grande; escolha um intervalo menor.');
           }
           return result;
          }"""
          if old_hist not in s:
              raise SystemExit('Trecho history33All esperado nao encontrado; nenhuma alteracao aplicada.')
          s = s.replace(old_hist, new_hist, 1)

          s = s.replace("const token=++history33Request,[start,end]=history33Bounds(),el=$('h33result');", "const token=++history33Request,empresaId=empresaAtual,[start,end]=history33Bounds(),el=$('h33result');", 1)
          s = s.replace("history33All('orcamentos','data_orcamento',start,end),history33All('vendas','data_venda',start,end)", "history33All('orcamentos','data_orcamento',start,end,empresaId),history33All('vendas','data_venda',start,end,empresaId)", 1)
          s = s.replace("if(token!==history33Request)return;\n   history33Records={orcamentos:quotes,vendas:sales};\n   await history33Display();", "if(token!==history33Request||empresaId!==empresaAtual)return;\n   history33Records={orcamentos:quotes,vendas:sales};\n   await history33Display(token,empresaId);", 1)
          s = s.replace("async function history33Display(){", "async function history33Display(token=history33Request,empresaId=empresaAtual){if(token!==history33Request||empresaId!==empresaAtual)return;", 1)
          s = s.replace("sb.from('clientes').select('id,empresa').eq('empresa_id',empresaAtual).in('id',missing)", "sb.from('clientes').select('id,empresa').eq('empresa_id',empresaId).in('id',missing)", 1)
          s = s.replace("$('h33result').innerHTML=html;", "if(token!==history33Request||empresaId!==empresaAtual)return;$('h33result').innerHTML=html;", 1)

          s = s.replace("Histórico Comercial • 3.3", "Histórico Comercial • 3.4")
          s = s.replace("Versão 3.2: respostas automáticas", "Versão 3.4: respostas automáticas")
          s = s.replace("Diagnóstico comercial 3.2", "Diagnóstico comercial 3.4")
          s = s.replace("Alertas e perdas • CRM 3.2", "Alertas e perdas • CRM 3.4")
          s = s.replace("Rentabilidade estimada • CRM 3.2", "Rentabilidade estimada • CRM 3.4")
          s = s.replace("return 'RELATÓRIO SEMANAL — '+day(d0)", "return 'RELATÓRIO SEMANAL — '+empresaNome()+' — '+day(d0)", 1)

          path.write_text(s, encoding='utf-8')

      - name: Commit das correcoes
        run: |
          if git diff --quiet -- index.html; then
            echo "Nenhuma alteracao necessaria."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "CRM 3.4: reforcar isolamento e remover limite de 1000 registros [skip crm34-hardening]"
          git push origin HEAD:desenvolvimento-3.4-multiempresa
