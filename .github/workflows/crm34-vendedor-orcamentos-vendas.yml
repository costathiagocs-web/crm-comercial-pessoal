name: CRM 3.4 vendedor orcamentos vendas
on:
  push:
    branches:
      - desenvolvimento-3.4-melhorias
    paths:
      - scripts/crm34_vendedor_orcamentos_vendas_sem_dashboard.py
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: desenvolvimento-3.4-melhorias
          fetch-depth: 0
      - name: Ajustar vendedor em orcamentos e vendas
        run: python scripts/crm34_vendedor_orcamentos_vendas_sem_dashboard.py
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "CRM 3.4: vendedor apenas em orcamentos e vendas" || exit 0
          git push origin HEAD:desenvolvimento-3.4-melhorias
