name: CRM 3.4 switch isolation once

on:
  push:
    branches:
      - desenvolvimento-3.4-multiempresa

permissions:
  contents: write

jobs:
  fix:
    if: ${{ !contains(github.event.head_commit.message || '', '[skip crm34-switch-fix]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: desenvolvimento-3.4-multiempresa
          fetch-depth: 0
      - name: Limpar dados visuais ao trocar empresa
        shell: python
        run: |
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text(encoding='utf-8')
          old="$('empresaSelecionada').onchange=async ev=>{const id=ev.target.value;if(!empresas.some(e=>e.id===id))return;empresaAtual=id;editingQuoteId=null;history33Records={orcamentos:[],vendas:[]};history33Request++;cabecalhoEmpresa();await refresh()};"
          new="$('empresaSelecionada').onchange=async ev=>{const id=ev.target.value;if(!empresas.some(e=>e.id===id))return;empresaAtual=id;editingQuoteId=null;history33Records={orcamentos:[],vendas:[]};history33Request++;chatHistory=[];data={clientes:[],orcamentos:[],vendas:[],acompanhamentos:[]};cabecalhoEmpresa();render();renderHistory33();await refresh()};"
          if old not in s:
              raise SystemExit('Trecho de troca de empresa nao encontrado; nenhuma alteracao aplicada.')
          s=s.replace(old,new,1)
          p.write_text(s,encoding='utf-8')
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "CRM 3.4: limpar dados visuais ao trocar empresa [skip crm34-switch-fix]"
          git push origin HEAD:desenvolvimento-3.4-multiempresa
