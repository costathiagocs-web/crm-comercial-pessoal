name: CRM 3.4 publicacao final
on:
  workflow_dispatch:
  push:
    branches:
      - desenvolvimento-3.4-melhorias
    paths:
      - .github/workflows/crm34-publicacao-final.yml
permissions:
  contents: write
jobs:
  finalize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: desenvolvimento-3.4-melhorias
          fetch-depth: 0
      - name: Ajustar arquivos finais
        run: |
          sed -i 's#desenvolvimento-3.4-melhorias/assets/logo-#main/assets/logo-#g' index.html
          rm -f assets/logo-eletro.svg assets/logo-stampo.svg
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html assets
          git commit -m "CRM 3.4: preparar arquivos finais para producao" || exit 0
          git push origin HEAD:desenvolvimento-3.4-melhorias
