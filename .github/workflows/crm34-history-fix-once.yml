name: CRM 3.4 history fix once

on:
  push:
    branches:
      - desenvolvimento-3.4-multiempresa

permissions:
  contents: write

jobs:
  fix:
    if: ${{ !contains(github.event.head_commit.message || '', '[skip crm34-history-fix2]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: desenvolvimento-3.4-multiempresa
          fetch-depth: 0
      - name: Aplicar ajuste
        shell: python
        run: |
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text(encoding='utf-8')
          checks={
            "if(token!==history33Request)return;": "if(token!==history33Request||empresaId!==empresaAtual)return;",
            "await history33Display();": "await history33Display(token,empresaId);",
            "}catch(e){if(token===history33Request)el.innerHTML=": "}catch(e){if(token===history33Request&&empresaId===empresaAtual)el.innerHTML=",
          }
          for old,new in checks.items():
              if old not in s:
                  raise SystemExit('Trecho esperado nao encontrado: '+old)
              s=s.replace(old,new,1)
          s=s.replace("/* Histórico Comercial 3.3 — consultas paginadas no Supabase; não altera tabelas. */","/* Histórico Comercial 3.4 — consultas paginadas e isoladas por empresa no Supabase. */",1)
          s=s.replace("Consulte orçamentos e vendas pela data registrada. Os indicadores consideram os registros encontrados no período.","Consulte orçamentos e vendas pela data registrada. Empresa ativa: <b>'+esc(empresaNome())+'</b>. Os indicadores consideram apenas os registros encontrados no período.",1)
          p.write_text(s,encoding='utf-8')
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "CRM 3.4: proteger historico na troca de empresa [skip crm34-history-fix2]"
          git push origin HEAD:desenvolvimento-3.4-multiempresa
