name: CRM 3.4 login alias comercial
on:
  push:
    branches:
      - crm34-alias-run
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: desenvolvimento-3.4-melhorias
          fetch-depth: 0
      - name: Aplicar alias Comercial
        run: python scripts/crm34_login_alias_comercial.py
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "CRM 3.4: permitir login com usuario Comercial" || exit 0
          git push origin HEAD:desenvolvimento-3.4-melhorias
