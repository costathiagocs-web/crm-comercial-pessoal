name: CRM 3.4 history race fix

on:
  push:
    branches:
      - desenvolvimento-3.4-multiempresa

permissions:
  contents: write

jobs:
  fix:
    if: ${{ !contains(github.event.head_commit.message || '', '[skip crm34-history-fix]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: desenvolvimento-3.4-multiempresa
          fetch-depth: 0
      - name: Corrigir concorrencia no historico
        shell: python
        run: |
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text(encoding='utf-8')
          old="""  if(token!==history33Request)return;
           history33Records={orcamentos:quotes,vendas:sales};
           await history33Display();
          }catch(e){if(token===history33Request)el.innerHTML='<p class=\"bad\">'+esc(e.message)+'</p>'}"""
          new="""  if(token!==history33Request||empresaId!==empresaAtual)return;
           history33Records={orcamentos:quotes,vendas:sales};
           await history33Display(token,empresaId);
          }catch(e){if(token===history33Request&&empresaId===empresaAtual)el.innerHTML='<p class=\"bad\">'+esc(e.message)+'</p>'}"""
          if old not in s:
              raise SystemExit('Trecho de loadHistory33 nao encontrado; nenhuma alteracao aplicada.')
          s=s.replace(old,new,1)
          s=s.replace("/* Histórico Comercial 3.3 — consultas paginadas no Supabase; não altera tabelas. */","/* Histórico Comercial 3.4 — consultas paginadas e isoladas por empresa no Supabase. */",1)
          s=s.replace("Os indicadores consideram os registros encontrados no período.</p>","Empresa ativa: <b>'+esc(empresaNome())+'</b>. Os indicadores consideram apenas os registros encontrados no período.</p>",1)
          p.write_text(s,encoding='utf-8')
      - name: Commit
        run: |
          if git diff --quiet -- index.html; then exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "CRM 3.4: proteger historico na troca de empresa [skip crm34-history-fix]"
          git push origin HEAD:desenvolvimento-3.4-multiempresa
